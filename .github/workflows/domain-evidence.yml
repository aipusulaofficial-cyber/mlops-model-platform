name: Domain Executable Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Execute domain evidence
        run: |
          mkdir -p artifacts
          python benchmarks/model_evidence.py | tee artifacts/model-domain-evidence.json
      - name: Validate evidence artifact
        run: python -m json.tool artifacts/model-domain-evidence.json >/dev/null
      - name: Upload domain evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: model-domain-evidence
          path: artifacts/model-domain-evidence.json
          if-no-files-found: error
