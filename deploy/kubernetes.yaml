apiVersion: apps/v1
kind: Deployment
metadata: {name: mlops-model-platform}
spec:
 replicas: 2
 selector: {matchLabels: {app: mlops-model-platform}}
 template:
  metadata: {labels: {app: mlops-model-platform}}
  spec:
   containers:
   - name: api
     image: mlops-model-platform:latest
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
     livenessProbe: {httpGet: {path: /health/live, port: 8000}}
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: mlops-model-platform}
spec: {selector: {app: mlops-model-platform}, ports: [{port: 80, targetPort: 8000}]}
