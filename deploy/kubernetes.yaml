apiVersion: v1
kind: Namespace
metadata:
  name: ai-platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-model-platform
  namespace: ai-platform
spec:
  replicas: 2
  selector: {matchLabels: {app: mlops-model-platform}}
  template:
    metadata: {labels: {app: mlops-model-platform}}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: mlops-model-platform:0.1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
          livenessProbe: {httpGet: {path: /health/live, port: 8000}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-model-platform
  namespace: ai-platform
spec:
  selector: {app: mlops-model-platform}
  ports: [{port: 80, targetPort: 8000}]
